{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LoginPage</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;

        /* Your background image */
        background-image:
            linear-gradient(
                135deg,
                rgba(5, 15, 30, 0.45),
                rgba(0, 0, 0, 0.20)
            ),
            url("{% static 'img_1.png' %}");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        justify-content: center;
        align-items: center;

        position: relative;
        overflow: hidden;
    }

    /* Soft blur/glow around the page */
    body::before {
        content: "";
        position: absolute;
        width: 450px;
        height: 450px;
        background: rgba(0, 188, 212, 0.18);
        filter: blur(120px);
        border-radius: 50%;
        top: -150px;
        left: -120px;
    }

    body::after {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        background: rgba(0, 255, 255, 0.12);
        filter: blur(120px);
        border-radius: 50%;
        bottom: -150px;
        right: -100px;
    }

    .login {
        position: relative;
        z-index: 2;

        width: 340px;
        padding: 42px 38px;

        /* Premium glass effect */
        background: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 22px;

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);

        animation: loginAppear 0.8s ease;
    }

    .login::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 22px;

        background: linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.18),
            transparent 50%
        );

        pointer-events: none;
    }

    form {
        position: relative;
        z-index: 2;
    }

    label {
        display: block;
        margin-bottom: 8px;

        color: white;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    input {
        width: 100%;
        height: 48px;

        padding: 0 15px;
        margin-bottom: 22px;

        background: rgba(255, 255, 255, 0.12);

        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;

        color: white;
        font-size: 14px;

        outline: none;

        transition: all 0.3s ease;
    }

    input::placeholder {
        color: rgba(255, 255, 255, 0.65);
    }

    input:focus {
        background: rgba(255, 255, 255, 0.18);
        border-color: #00e5ff;

        box-shadow:
            0 0 0 3px rgba(0, 229, 255, 0.12),
            0 0 20px rgba(0, 229, 255, 0.15);
    }

    button {
        width: 100%;
        height: 50px;

        margin-top: 5px;

        border: none;
        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #00bcd4,
            #008c9e
        );

        color: white;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;

        cursor: pointer;

        box-shadow:
            0 10px 25px rgba(0, 188, 212, 0.3);

        transition: all 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);

        background: linear-gradient(
            135deg,
            #00e5ff,
            #00a6b8
        );

        box-shadow:
            0 15px 30px rgba(0, 229, 255, 0.35);
    }

    button:active {
        transform: translateY(0);
    }

    @keyframes loginAppear {
        from {
            opacity: 0;
            transform: translateY(25px) scale(0.96);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @media (max-width: 500px) {
        .login {
            width: 80%;
            padding: 35px 25px;
        }
    }
</style>
</head>
<body>
    <div class="login">
    <form method="POST">
        {% csrf_token %}
        <label>Username:</label>
        <input type="text" name="name" placeholder="Enter your Name">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your Password">
        <button type="submit">Login</button>
    </form>

</div>

</body>
</html>
