{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bus</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    font-family: 'Inter', sans-serif;

    background-image:
        linear-gradient(
            120deg,
            rgba(0, 0, 0, 0.75),
            rgba(0, 0, 0, 0.35),
            rgba(0, 0, 0, 0.70)
        ),
        url("{% static 'img_2.png' %}");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    text-align: center;

    overflow: hidden;
}

/* Background glow */

body::before {
    content: "";
    position: absolute;

    width: 450px;
    height: 450px;

    background: rgba(229, 9, 20, 0.15);

    border-radius: 50%;
    filter: blur(120px);

    top: -180px;
    left: -150px;

    pointer-events: none;
}

body::after {
    content: "";
    position: absolute;

    width: 400px;
    height: 400px;

    background: rgba(255, 255, 255, 0.08);

    border-radius: 50%;
    filter: blur(120px);

    bottom: -180px;
    right: -150px;

    pointer-events: none;
}


/* Main content */

center {
    position: relative;
    z-index: 2;

    padding: 60px 40px;

    max-width: 850px;

    animation: fadeUp 1s ease;
}


/* Heading */

h1 {
    font-family: 'Inter', sans-serif;

    font-size: 64px;
    font-weight: 800;

    letter-spacing: -2px;

    margin-bottom: 18px;

    background: linear-gradient(
        135deg,
        #ffffff,
        #ff4b55,
        #e50914
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 10px 40px rgba(229, 9, 20, 0.25);
}


/* Small elegant line */

h1::after {
    content: "";

    display: block;

    width: 70px;
    height: 4px;

    margin: 20px auto 0;

    border-radius: 20px;

    background: linear-gradient(
        90deg,
        #ff4b55,
        #e50914
    );

    box-shadow:
        0 0 20px rgba(229, 9, 20, 0.7);
}


/* Description */

p {
    color: rgba(255, 255, 255, 0.85);

    font-size: 19px;
    font-weight: 400;

    letter-spacing: 0.4px;

    line-height: 1.7;

    margin-top: 25px;
}


/* Buttons */

a {
    position: relative;

    display: inline-block;

    min-width: 165px;

    margin: 38px 7px 0;

    padding: 15px 28px;

    border-radius: 10px;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    letter-spacing: 0.4px;

    color: white;

    overflow: hidden;

    transition: all 0.35s ease;
}


/* Login */

a[href="/login/"] {
    background: linear-gradient(
        135deg,
        #e50914,
        #b20710
    );

    border: 1px solid rgba(255, 255, 255, 0.15);

    box-shadow:
        0 12px 30px rgba(229, 9, 20, 0.35);
}

a[href="/login/"]:hover {
    transform: translateY(-4px);

    background: linear-gradient(
        135deg,
        #ff303a,
        #e50914
    );

    box-shadow:
        0 18px 40px rgba(229, 9, 20, 0.55);
}


/* Create Account */

a[href="/create-user/"] {
    background: rgba(255, 255, 255, 0.08);

    border: 1px solid rgba(255, 255, 255, 0.3);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.3);
}

a[href="/create-user/"]:hover {
    transform: translateY(-4px);

    background: rgba(255, 255, 255, 0.16);

    border-color: rgba(255, 255, 255, 0.55);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.4);
}


/* Button shine */

a::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.25),
        transparent
    );

    transform: skewX(-20deg);

    transition: 0.6s;
}

a:hover::before {
    left: 130%;
}


/* Page animation */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* Mobile */

@media (max-width: 600px) {

    h1 {
        font-size: 43px;
        letter-spacing: -1px;
    }

    p {
        font-size: 16px;
    }

    a {
        width: 210px;
        margin-top: 15px;
    }

    center {
        padding: 40px 20px;
    }

}
    </style>
</head>

<body>

    <center>
        <h1>TravelNest</h1>
        <p>India's No. 1 online bus ticket booking site</p>
    </center>
    <br><br>

<a href="/login/">Login</a>
<a href="/create-user/">Create Account</a>


</body>
</html>
