{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create-Account</title>

    <style>
       @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;

    background: #080808;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    overflow: hidden;
}

/* =========================================
   LEFT BACKGROUND IMAGE SECTION
========================================= */

body::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;

    width: 52%;
    height: 100vh;

    background-image:
        linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.15),
            rgba(0, 0, 0, 0.55)
        ),
        url("{% static 'img_3.png' %}");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: 0;
}

/* =========================================
   EMPTY / DARK RIGHT SECTION
========================================= */

body::after {
    content: "";

    position: absolute;
    right: 0;
    top: 0;

    width: 55%;
    height: 100vh;

    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(229, 9, 20, 0.12),
            transparent 35%
        ),
        #080808;

    z-index: 0;
}

/* =========================================
   FORM BOX
========================================= */

.box {
    position: relative;
    z-index: 5;

    width: 390px;

    padding: 42px 40px;

    margin-left: 48%;

    background: rgba(20, 20, 20, 0.88);

    border: 1px solid rgba(255, 255, 255, 0.10);

    border-radius: 20px;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.65),
        0 0 40px rgba(229, 9, 20, 0.08);

    animation: formAppear 0.8s ease;
}

/* =========================================
   FORM TITLE EFFECT
========================================= */

.box::before {
    content: "CREATE ACCOUNT";

    display: block;

    margin-bottom: 32px;

    color: #ffffff;

    font-size: 25px;
    font-weight: 800;

    letter-spacing: 1px;
}

/* Red line under title */

.box::after {
    content: "";

    position: absolute;

    top: 78px;
    left: 40px;

    width: 55px;
    height: 3px;

    border-radius: 20px;

    background: #e50914;

    box-shadow:
        0 0 15px rgba(229, 9, 20, 0.7);
}

/* =========================================
   LABEL
========================================= */

label {
    display: block;

    margin-bottom: 9px;

    color: #e5e5e5;

    font-size: 13px;
    font-weight: 600;

    letter-spacing: 0.3px;
}

/* =========================================
   INPUT
========================================= */

input {
    width: 100%;

    padding: 14px 15px;

    background: rgba(255, 255, 255, 0.055);

    color: white;

    border: 1px solid rgba(255, 255, 255, 0.14);

    border-radius: 9px;

    outline: none;

    font-family: 'Inter', sans-serif;
    font-size: 14px;

    transition: all 0.3s ease;
}

/* Placeholder */

input::placeholder {
    color: rgba(255, 255, 255, 0.38);
}

/* Focus */

input:focus {
    border-color: #e50914;

    background: rgba(255, 255, 255, 0.08);

    box-shadow:
        0 0 0 3px rgba(229, 9, 20, 0.10),
        0 0 20px rgba(229, 9, 20, 0.08);
}

/* =========================================
   REMOVE BR TAG SPACE
========================================= */

br {
    display: none;
}

/* =========================================
   FORM FIELD SPACING
========================================= */

label:not(:first-child) {
    margin-top: 21px;
}

/* =========================================
   BUTTON
========================================= */

button {
    position: relative;

    width: 100%;

    margin-top: 28px;

    padding: 15px;

    border: none;
    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #ff303a,
        #e50914,
        #b20710
    );

    color: white;

    font-family: 'Inter', sans-serif;

    font-size: 14px;
    font-weight: 700;

    letter-spacing: 0.5px;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        0 12px 30px rgba(229, 9, 20, 0.25);

    transition: all 0.35s ease;
}

/* Button shine */

button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.25),
        transparent
    );

    transform: skewX(-20deg);

    transition: 0.6s;
}

button:hover::before {
    left: 130%;
}

button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 18px 40px rgba(229, 9, 20, 0.40);
}

button:active {
    transform: translateY(0);
}

/* =========================================
   ANIMATION
========================================= */

@keyframes formAppear {

    from {
        opacity: 0;
        transform: translateX(40px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    body {
        overflow-y: auto;
        padding: 30px 15px;
    }

    body::before {
        width: 100%;
        height: 100%;

        opacity: 0.18;
    }

    body::after {
        width: 100%;
    }

    .box {
        width: 100%;
        max-width: 390px;

        margin-left: 0;

        padding: 35px 28px;
    }

    .box::after {
        left: 28px;
    }

}
    </style>
</head>
<body>


<div class="box">

    <form method="POST">
        {% csrf_token %}
        <label>Enter Your Name</label>
        <input type="text" name="name" placeholder="Enter full name">
        <br><br>
        <label>Set your Password</label>
        <input type="password" name="password" placeholder="">
        <br><br>
        <label>Enter Your Age</label>
        <input type="number" name="age" min="18" max="70" placeholder="Enter your Age">
        <br><br>
        <label>Enter your E-mail</label>
        <input type="email" name="email" placeholder="Enter your mail-id">
        <br><br>
        <label>Enter your Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter your number">
        <br><br>
        <button type="submit">Create User</button>
    </form>
</div>

</body>
</html>
